<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoRadar — OSINT и геоаналитика</title>
  <script src="https://yandex.ru" type="text/javascript"></script>
  <style>
    :root {
      --bg: #0f172a; --panel: #1e293b; --border: #334155;
      --text: #f8fafc; --muted: #94a3b8; --accent: #3b82f6;
      --accent-hover: #2563eb; --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
    .sidebar {
      width: 400px; background: var(--panel); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; padding: 20px; overflow-y: auto; z-index: 10;
    }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .header h1 { font-size: 20px; }
    .settings-btn {
      background: #334155; border: none; color: var(--text); padding: 6px 12px;
      border-radius: 8px; font-size: 12px; cursor: pointer;
    }
    .api-box {
      background: #0f172a; border: 1px solid var(--border); padding: 12px;
      border-radius: 10px; margin-bottom: 16px; display: none;
    }
    .api-box.open { display: block; }
    .api-row { display: flex; gap: 8px; margin-top: 6px; }
    .api-row input { flex: 1; }
    .save-key-btn {
      background: var(--success); color: #fff; border: none; padding: 0 12px;
      border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px;
    }
    .tabs { display: flex; background: #0f172a; padding: 4px; border-radius: 10px; margin-bottom: 14px; }
    .tab {
      flex: 1; text-align: center; padding: 8px; font-size: 13px; font-weight: bold;
      border-radius: 8px; cursor: pointer; color: var(--muted);
    }
    .tab.active { background: var(--accent); color: #fff; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 6px; }
    input[type="text"], input[type="password"], input[type="number"], textarea {
      width: 100%; background: #0f172a; border: 1px solid var(--border); color: var(--text);
      padding: 10px; border-radius: 8px; font-size: 14px; outline: none;
    }
    textarea { height: 80px; resize: vertical; }
    .file-drop {
      border: 1px dashed var(--border); border-radius: 8px; padding: 12px;
      text-align: center; cursor: pointer; background: #0f172a; font-size: 13px; color: var(--muted);
    }
    #preview { max-width: 100%; max-height: 140px; border-radius: 8px; margin-top: 10px; display: none; }
    .main-btn {
      margin-top: 16px; width: 100%; padding: 12px; background: var(--accent); color: #fff;
      border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer;
    }
    .main-btn:disabled { background: #475569; cursor: not-allowed; }
    .result-card {
      margin-top: 16px; background: #0f172a; border: 1px solid var(--border);
      border-radius: 10px; padding: 14px; display: none; font-size: 13px; line-height: 1.5;
    }
    .result-card h3 { font-size: 15px; color: #60a5fa; margin-bottom: 6px; }
    .badge {
      display: inline-block; background: rgba(59, 130, 246, 0.2); color: #93c5fd;
      padding: 2px 8px; border-radius: 6px; font-size: 11px; margin-bottom: 8px;
    }
    .poi-list { margin-top: 10px; padding-left: 16px; color: #cbd5e1; }
    .poi-list li { margin-bottom: 5px; }
    #map { flex: 1; height: 100vh; width: 100%; background: #1e293b; z-index: 1; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="header">
      <h1>🛰️ GeoRadar</h1>
      <button class="settings-btn" id="keyToggleBtn" onclick="toggleApiBox()">🔑 API-ключ</button>
    </div>

    <div class="api-box" id="apiBox">
      <label style="margin-top:0;">Ключ Mistral AI (сохранится навсегда):</label>
      <div class="api-row">
        <input type="password" id="apiKey" placeholder="Вставь ключ сюда...">
        <button class="save-key-btn" onclick="saveApiKey()">Сохранить</button>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" id="tabRadius" onclick="switchMode('radius')">🚶 Радиус от точки</div>
      <div class="tab" id="tabSearch" onclick="switchMode('search')">🏢 Поиск объекта / фото</div>
    </div>

    <div id="modeRadius">
      <label>Отправная точка (метро, адрес, ориентир):</label>
      <input type="text" id="startPoint" placeholder="Например: Кремль, Москва">

      <label>Время в пути пешком (минут):</label>
      <input type="number" id="walkMinutes" value="5" min="1" max="120">

      <label>Дополнительные зацепки (необязательно):</label>
      <textarea id="radiusHints" placeholder="Например: шёл в какой-то ТЦ..."></textarea>
    </div>

    <div id="modeSearch" style="display: none;">
      <label>Загрузи фото места или здания (если есть):</label>
      <div class="file-drop" onclick="document.getElementById('photoInput').click()">
        📷 Нажми, чтобы выбрать фото
        <input type="file" id="photoInput" accept="image/*" style="display:none;">
      </div>
      <img id="preview" alt="Предпросмотр">

      <label>Наводящие подсказки (район, вывески, окружение):</label>
      <textarea id="searchHints" placeholder="Например: район Сокол, рядом аптека и сквер..."></textarea>
    </div>

    <button class="main-btn" id="actionBtn" onclick="runAnalysis()">Построить зону поиска</button>

    <div class="result-card" id="resultCard">
      <span class="badge" id="resBadge">Анализ завершен</span>
      <h3 id="resTitle"></h3>
      <p id="resDesc"></p>
      <ul class="poi-list" id="resList"></ul>
    </div>
  </div>

  <div id="map"></div>
  <script>
    let currentMode = 'radius';
    let base64Image = null;
    let myMap = null;

    // Запуск Яндекс Карт
    if (typeof ymaps !== 'undefined') {
      ymaps.ready(function () {
        myMap = new ymaps.Map('map', {
          center: [55.7558, 37.6173],
          zoom: 12,
          controls: ['zoomControl', 'typeSelector']
        });
      });
    }

    window.onload = function() {
      const savedKey = localStorage.getItem('mistral_api_key');
      if (savedKey) {
        document.getElementById('apiKey').value = savedKey;
        document.getElementById('keyToggleBtn').textContent = '✅ Ключ активен';
      } else {
        document.getElementById('apiBox').classList.add('open');
      }
    };

    function toggleApiBox() {
      document.getElementById('apiBox').classList.toggle('open');
    }

    function saveApiKey() {
      const val = document.getElementById('apiKey').value.trim();
      if (!val) return alert('Вставь ключ в поле!');
      localStorage.setItem('mistral_api_key', val);
      document.getElementById('keyToggleBtn').textContent = '✅ Ключ активен';
      document.getElementById('apiBox').classList.remove('open');
    }

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('tabRadius').classList.toggle('active', mode === 'radius');
      document.getElementById('tabSearch').classList.toggle('active', mode === 'search');
      document.getElementById('modeRadius').style.display = mode === 'radius' ? 'block' : 'none';
      document.getElementById('modeSearch').style.display = mode === 'search' ? 'block' : 'none';
      document.getElementById('actionBtn').textContent =
        mode === 'radius' ? 'Построить зону поиска' : 'Найти объект на карте';
    }

    document.getElementById('photoInput').addEventListener('change', function(e) {
      const file = e.target.files.item(0);
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        base64Image = ev.target.result;
        const img = document.getElementById('preview');
        img.src = base64Image;
        img.style.display = 'block';
      };
      reader.readAsDataURL(file);
    });

    async function callMistral(apiKey, content) {
      const response = await fetch('https://mistral.ai', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + apiKey
        },
        body: JSON.stringify({
          model: 'pixtral-12b-2409',
          messages: [{ role: 'user', content: content }],
          response_format: { type: 'json_object' }
        })
      });
      return await response.json();
    }

    async function runAnalysis() {
      const apiKey = localStorage.getItem('mistral_api_key') || document.getElementById('apiKey').value.trim();
      if (!apiKey) {
        document.getElementById('apiBox').classList.add('open');
        return alert('Сначала вставь и сохрани API-ключ!');
      }

      const btn = document.getElementById('actionBtn');
      btn.disabled = true;
      btn.textContent = 'Анализирую карту...';

      let promptText = '';
      const content = [];

      if (currentMode === 'radius') {
        const point = document.getElementById('startPoint').value.trim();
        const mins = parseInt(document.getElementById('walkMinutes').value) || 5;
        const hints = document.getElementById('radiusHints').value.trim();
        if (!point) {
          btn.disabled = false;
          btn.textContent = 'Построить зону поиска';
          return alert('Укажи отправную точку!');
        }
        const radiusMeters = mins * 75;
        promptText = 'Ты профессиональный геоаналитик. Отправная точка: "' + point + '". Время пешком: ' + mins + ' минут (радиус ' + radiusMeters + ' м). Зацепки: "' + (hints || 'нет') + '". Определи точные координаты отправной точки и 2-4 реальных объекта рядом в этом радиусе, подходящих под зацепки. Верни строго JSON без markdown: {"title": "Название точки", "lat": 55.7520, "lng": 37.6175, "radius": ' + radiusMeters + ', "summary": "Подробный разбор по карте", "candidates": [{"name": "Название и адрес объекта", "lat": 55.7547, "lng": 37.6215}]}';
        content.push({ type: 'text', text: promptText });
      } else {
        const hints = document.getElementById('searchHints').value.trim();
        if (!base64Image && !hints) {
          btn.disabled = false;
          btn.textContent = 'Найти объект на карте';
          return alert('Загрузи фото или напиши подсказки!');
        }
        promptText = 'Ты эксперт по OSINT и картам. Найди конкретное место или учреждение по фото и подсказкам: "' + (hints || 'нет') + '". Верни строго JSON без markdown: {"title": "Название и точный адрес", "lat": 55.7558, "lng": 37.6173, "radius": 200, "summary": "Объяснение по карте и фото", "candidates": []}';
        content.push({ type: 'text', text: promptText });
        if (base64Image) content.push({ type: 'image_url', image_url: base64Image });
      }

      try {
        const data = await callMistral(apiKey, content);
        if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));

        const rawText = data.choices.at(0).message.content;
        const res = JSON.parse(rawText);

        if (myMap) {
          myMap.geoObjects.removeAll();

          // Главная метка
          const mainPlacemark = new ymaps.Placemark([res.lat, res.lng], {
            balloonContent: '<b>' + res.title + '</b>'
          }, { preset: 'islands#blueDotIcon' });
          myMap.geoObjects.add(mainPlacemark);

          // Зона поиска (круг)
          const searchCircle = new ymaps.Circle([[res.lat, res.lng], res.radius || 375], {}, {
            fillColor: '#3b82f633',
            strokeColor: '#3b82f6',
            strokeOpacity: 0.8,
            strokeWidth: 2
          });
          myMap.geoObjects.add(searchCircle);

          // Точки-кандидаты внутри зоны
          if (res.candidates && res.candidates.length > 0) {
            res.candidates.forEach(function(c) {
              const candMark = new ymaps.Placemark([c.lat, c.lng], {
                balloonContent: '<b>Возможная точка:</b> ' + c.name
              }, { preset: 'islands#greenCircleDotIcon' });
              myMap.geoObjects.add(candMark);
            });
          }

          myMap.setCenter([res.lat, res.lng], 15);
        }

        const listEl = document.getElementById('resList');
        listEl.innerHTML = '';
        if (res.candidates && res.candidates.length > 0) {
          res.candidates.forEach(function(c) {
            const li = document.createElement('li');
            li.textContent = c.name;
            listEl.appendChild(li);
          });
        }

        document.getElementById('resBadge').textContent = currentMode === 'radius' ? 'Зона ~' + res.radius + ' м' : 'Объект найден';
        document.getElementById('resTitle').textContent = res.title;
        document.getElementById('resDesc').textContent = res.summary;
        document.getElementById('resultCard').style.display = 'block';

      } catch (err) {
        alert('Ошибка: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = currentMode === 'radius' ? 'Построить зону поиска' : 'Найти объект на карте';
      }
    }
  </script>
</body>
</html>
